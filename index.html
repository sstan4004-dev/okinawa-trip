@keyframes wv{50%{transform:translateX(-12px)}}
@keyframes sp{50%{transform:rotate(14deg)}}

var CK=[["待辦預訂",["美麗海水族館電子票（1 歲免費，買 4 張成人票）","幸福鬆餅 11/13 訂位：098-851-0009","潛水員牛排 11/11 訂位","漁師食堂 本部店確認營業時間","ユニバースレンタカー：確認座椅類型、ETC 卡、接駁時間","艾貝斯特：確認停車場","兩家飯店：告知 11/10 晚到","星宇：確認寶寶嬰兒票"]],
["證件・金錢",["護照（含寶寶）","台灣駕照＋日文譯本","信用卡、日幣現金","旅平險與不便險資料","機票、飯店、租車訂單截圖"]],
["電子用品",["eSIM／網卡","行動電源（確認星宇規定）","車用手機架、充電線","Visit Japan Web 截圖"]],
["寶寶",["輕便推車","尿布、濕紙巾","副食品／奶粉","兒童餐具","常備藥","安撫玩具、換洗衣物"]],
["衣物・長輩",["薄外套（水族館冷氣強、晚上較涼）","防滑好走的鞋","防曬帽、雨具","長輩常備藥","折疊購物袋"]]];

var G="https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=";

var MUST=["水族館","古宇利大橋","日落海灘","幸福鬆餅","漁師食堂","潛水員牛排","瀨長島"];
var TG=[["🚗","自駕","tc"],["🛣️","自駕","tc"],["🚇","單軌","ta"],["🚕","計程車","ty"],["🚐","接送","ty"],["✈️","飛機","tg"]];

var day=0,sv={},M=document.getElementById("main");

document.getElementById("nav").innerHTML=NAV.map(function(n){return '<a href="#'+n[0]+'">'+n[1]+'</a>'}).join("");
var W=DAYS.map(function(){return {i:"🌤️",t:"20–25°",p:"常年氣候"}});
var WC=function(c){return c==0?"☀️":c<3?"🌤️":c==3?"☁️":c<50?"🌫️":c<70?"🌧️":c<85?"🌦️":"⛈️"};
function wxLoad(){[[26.59,127.98,[0,1]],[26.21,127.68,[2,3,4]]].forEach(function(L){
fetch("https://api.open-meteo.com/v1/forecast?latitude="+L[0]+"&longitude="+L[1]+"&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo&start_date=2026-11-10&end_date=2026-11-14").then(function(r){return r.json()}).then(function(j){var d=j.daily;if(!d)return;
L[2].forEach(function(k){if(d.temperature_2m_max[k]==null)return;W[k]={i:WC(d.weather_code[k]),t:Math.round(d.temperature_2m_max[k])+"° / "+Math.round(d.temperature_2m_min[k])+"°",p:"降雨 "+(d.precipitation_probability_max[k]||0)+"%"}});drawW()}).catch(function(){})})}

var T0=new Date(2026,10,10),N=new Date(),K=Math.round((T0-new Date(N.getFullYear(),N.getMonth(),N.getDate()))/864e5);
document.getElementById("cd").innerHTML=K>0?'距離出發還有 <b>'+K+'</b> 天':K>-5?'旅行第 <b>'+(1-K)+'</b> 天':'旅程結束，歡迎回家';
if(K<=0&&K>-5)day=-K;
function tagOf(t){for(var i=0;i<TG.length;i++)if(t.indexOf(TG[i][0])==0)return '<span class="tag '+TG[i][2]+'">'+TG[i][1]+'</span>';return ""}
function must(t){return MUST.some(function(m){return t.indexOf(m)>=0})}
function goBtn(q){return q?'<a class="go" target="_blank" rel="noopener" href="'+G+encodeURIComponent(q)+'">📍 Google 導航</a><br><div class="ph">🚘 導航機電話　'+(PH[q]||'<i>待補</i>')+'</div>':""}
function drawDay(b){var D=DAYS[day],h='',c='';
DAYS.forEach(function(x,i){c+='<button class="chip'+(i==day?" on":"")+'" onclick="day='+i+';drawDay(1)"><b>Day '+(i+1)+'</b><br>'+x.d.slice(0,5)+'</button>'});
document.getElementById("days").innerHTML=c;
h='<div class="hd"><h2>'+D.d+'</h2><span>'+D.s+'</span><br><span class="wl">'+W[day].i+' '+W[day].t+'・'+W[day].p+'</span></div><ul class="tl">';
D.i.forEach(function(e,n){var m=must(e[1]);h+='<li class="'+(m?"must":"")+'" style="--i:'+n+'"><span class="tm">'+e[0]+'</span><h3>'+e[1]+tagOf(e[1])+(m?'<span class="mu">必去</span>':'')+'</h3>'+(e[2]?'<p>'+e[2]+'</p>':'')+goBtn(e[3])+'</li>'});
document.getElementById("dc").innerHTML=h+'</ul>'}
function tk(k,v){sv[k]=v;try{localStorage.setItem("okck",JSON.stringify(sv))}catch(e){}drawTd()}
function drawTd(){var h='',cl=["--c","--y","--a","--g","--c"];
CK.forEach(function(g,gi){h+='<div class="card"><h3><span class="lb" style="background:var('+cl[gi]+')">'+g[0]+'</span></h3>';g[1].forEach(function(t,i){var k=gi+"-"+i;h+='<label class="ck'+(sv[k]?" done":"")+'"><input type="checkbox" '+(sv[k]?"checked":"")+' onchange="tk(\''+k+'\',this.checked)"><span>'+t+'</span></label>'});h+='</div>'});
document.getElementById("tdc").innerHTML=h+'<div class="card" style="background:var(--y)"><p>🧾 <b>退稅新制（11/1 起）</b>：先付含稅價，結帳出示護照並保留收據與 QR Code，離境前在機場機台查驗後才能退稅。</p></div>'}
document.getElementById("hoc").innerHTML=LODGE.map(function(L){return '<div class="card"><h3>🏨 '+L.n+'</h3><p><span class="lb" style="background:var(--g)">'+L.t+'</span></p><p>'+L.a+'</p><p>'+L.x+'</p>'+goBtn(L.m)+'</div>'}).join("");
drawW();drawTd();wxLoad();
